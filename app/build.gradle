plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cartoonite.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cartoonite.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // Due varianti: mobile (telefono/tablet/Chromebook) e tv (Android TV/Google TV)
    flavorDimensions "device"
    productFlavors {
        mobile {
            dimension "device"
            versionNameSuffix ""
        }
        tv {
            dimension "device"
            versionNameSuffix "-tv"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// I sorgenti contengono caratteri unicode (▶, –, °, ×): forza UTF-8 in compilazione
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'org.jsoup:jsoup:1.17.2'

    // Player video nativo (riproduzione HLS/mp4)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
