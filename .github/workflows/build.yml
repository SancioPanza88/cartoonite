name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK (mobile + TV)
        run: gradle assembleMobileDebug assembleTvDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk cartoonite.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk cartoonite-tv.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cartoonite-apks
          path: |
            cartoonite.apk
            cartoonite-tv.apk

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cartoonite APK
          body: |
            APK sempre aggiornate all'ultimo commit.
            - `cartoonite.apk` — telefono, tablet e Chromebook
            - `cartoonite-tv.apk` — Android TV / Google TV
          files: |
            cartoonite.apk
            cartoonite-tv.apk
          make_latest: true
